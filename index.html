<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{
  --bg:#f3efe6;--panel:#ebe6da;--text:#2e2c28;--muted:#7a756a;--line:#d9d2c2;--accent:#2f6f6a;--accent-t:#fff;--sel:#ddd6c4;--danger:#a4473d;
  --fs:19px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="sage"]{--bg:#e6ebe2;--panel:#dbe2d6;--text:#25302a;--muted:#6b786f;--line:#c6d0c0;--accent:#3d6b57;--sel:#cbd6c5;--danger:#a4473d}
:root[data-theme="dark"]{--bg:#1f2326;--panel:#262b2f;--text:#d6d9d6;--muted:#8a9190;--line:#363c40;--accent:#7fbfb3;--accent-t:#14201e;--sel:#313840;--danger:#e0877c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:16px 16px 8px;display:flex;gap:8px;align-items:center}
.top h1{font-size:18px;margin:0;flex:1;font-weight:600}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{margin:4px 16px 8px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:calc(100% - 32px)}
.list{overflow:auto;flex:1;padding:4px 8px 16px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:10px 12px;margin-bottom:2px}
.item:hover{background:var(--sel)}
.item.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:24px 16px;text-align:center;line-height:1.5}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sel)}
.seg button.on{background:var(--accent);color:var(--accent-t)}
.status{color:var(--muted);font-size:13px}
.menu{display:none}
/* FIX: overflow-anchor:none stops the browser from shifting the view on its own; extra bottom space keeps the scroll position stable when text is deleted */
.paper{flex:1;overflow:auto;padding:32px 20px 45vh;overflow-anchor:none}
.col{max-width:68ch;margin:0 auto}
.title{width:100%;border:0;background:transparent;font-family:Literata,Georgia,"Times New Roman",serif;font-size:calc(var(--fs) * 1.7);font-weight:600;line-height:1.25;padding:0;margin:0 0 16px;outline:0;display:block;resize:none;overflow:hidden;overflow-wrap:anywhere}
.body{width:100%;min-height:60vh;outline:0;font-family:Literata,Georgia,"Times New Roman",serif;font-size:var(--fs);line-height:1.8;padding:0;white-space:pre-wrap;overflow-wrap:anywhere}
.body:empty::before{content:attr(data-ph);color:var(--muted);opacity:.7;pointer-events:none}
.fmt{position:sticky;top:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--bg);padding:8px 0;margin:0 0 14px;border-bottom:1px solid var(--line)}
.fmt .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.fmt .lbl b{color:var(--text);font-weight:600}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);padding:0}
.sw:hover{transform:scale(1.12)}
.fmt input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer}
.fb{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:13px}
.fb:hover{background:var(--sel)}
.fmt .sp2{flex:1}
.sym{display:none;position:absolute;top:100%;right:0;z-index:6;width:min(300px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);grid-template-columns:repeat(7,1fr);gap:4px}
.sym.open{display:grid}
.sym button{border:0;background:transparent;border-radius:6px;font-size:18px;padding:6px 0}
.sym button:hover{background:var(--sel)}
.title::placeholder,.body::placeholder{color:var(--muted);opacity:.7}
.foot{color:var(--muted);font-size:13px;margin-top:12px}
.none{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:24px;line-height:1.6}

/* ---- Skills learned (organized) ---- */
.skills{display:none;margin-top:28px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;white-space:normal}
.sk-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 4px}
.skills h3{margin:0;font-size:16px;font-weight:600}
.sk-count{color:var(--muted);font-size:13px}
.skills p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}
.sk-add{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.sk-add textarea{width:100%;min-width:0;min-height:42px;max-height:180px;resize:none;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);line-height:1.4;display:block;overflow-y:auto}
.sk-add .btn{height:42px}
.sk-list{list-style:none;counter-reset:sk;margin:14px 0 0;padding:0;border-top:1px solid var(--line)}
.sk-list li{counter-increment:sk;display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.sk-list li::before{content:counter(sk);width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-t);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.sk-list .m{min-width:0}
.sk-list .t{display:block;overflow-wrap:anywhere;line-height:1.45;white-space:pre-wrap;tab-size:4}
.sk-list .d{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sk-list .acts{display:flex;gap:2px;align-items:center}
.sk-list .acts button{border:0;background:transparent;color:var(--muted);font-size:15px;line-height:1;width:28px;height:28px;border-radius:6px;padding:0}
.sk-list .acts button:hover:not(:disabled){background:var(--sel);color:var(--text)}
.sk-list .acts .x{font-size:18px}
.sk-list .acts .x:hover:not(:disabled){color:var(--danger)}
.sk-list .acts button:disabled{opacity:.25;cursor:default}
.sk-none{color:var(--muted);font-size:14px;margin-top:12px}

/* ---- Download dialog (added) ---- */
.dl-back{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.dl-back.open{display:flex}
.dl-box{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;max-height:min(560px,90%);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dl-head{padding:18px 20px 4px}
.dl-head h2{margin:0;font-size:18px;font-weight:600}
.dl-head p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.dl-box .search{margin:12px 20px 8px;width:calc(100% - 40px)}
.dl-list{overflow:auto;flex:1;padding:0 12px 8px;min-height:80px}
.dl-list .item.on b::before{content:"✓ ";color:var(--accent)}
.dl-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px 18px;border-top:1px solid var(--line)}
.dl-msg{flex:1;color:var(--muted);font-size:13px;min-height:1em}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.show aside{transform:none}
  .menu{display:inline-block}
  .paper{padding:20px 16px 45vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="top">
      <h1>Notes</h1>
      <button class="btn primary" id="new">+ New note</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search notes" aria-label="Search notes">
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="bar">
      <button class="btn menu" id="menu" aria-label="Open notes list">Notes list</button>
      <div class="seg" id="themes" role="group" aria-label="Page color">
        <button data-t="light">Paper</button><button data-t="sage">Sage</button><button data-t="dark">Night</button>
      </div>
      <div class="seg" role="group" aria-label="Text size">
        <button id="dec" aria-label="Smaller text">A−</button><button id="inc" aria-label="Larger text">A+</button>
      </div>
      <span class="sp"></span>
      <span class="status" id="status"></span>
      <button class="btn" id="sk">Skills learned</button>
      <button class="btn" id="dl">Download</button>
      <button class="btn" id="pin">Pin</button>
      <button class="btn" id="del" style="color:var(--danger)">Delete</button>
    </div>
    <div class="paper" id="paper"></div>
  </main>
</div>

<div class="dl-back" id="dlBack">
  <div class="dl-box" role="dialog" aria-modal="true" aria-labelledby="dlTitle">
    <div class="dl-head">
      <h2 id="dlTitle">Download a note</h2>
      <p>Choose the note title you want to download. Its content will be saved as a text file.</p>
    </div>
    <input class="search" id="dlQ" type="search" placeholder="Type to find a title" aria-label="Find a note title">
    <div class="dl-list" id="dlList"></div>
    <div class="dl-foot">
      <span class="dl-msg" id="dlMsg"></span>
      <button class="btn" id="dlCancel">Cancel</button>
      <button class="btn primary" id="dlGo" disabled>Download</button>
    </div>
  </div>
</div>

<script>
(function(){
  var K='mga-tala-v1', P='mga-tala-prefs';
  var notes=[], cur=null, prefs={theme:null,fs:19}, timer=null;
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  notes=load(K,[]); prefs=Object.assign(prefs,load(P,{}));
  var $=function(i){return document.getElementById(i)};
  var app=$('app'),list=$('list'),paper=$('paper'),q=$('q'),status=$('status');

  function theme(t){
    if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
    document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('#themes button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
    return t;
  }
  function size(){document.documentElement.style.setProperty('--fs',prefs.fs+'px');fit()}
  theme(prefs.theme); size();

  $('themes').onclick=function(e){var t=e.target.dataset.t;if(!t)return;prefs.theme=t;theme(t);save(P,prefs)};
  $('inc').onclick=function(){prefs.fs=Math.min(30,prefs.fs+1);size();save(P,prefs)};
  $('dec').onclick=function(){prefs.fs=Math.max(14,prefs.fs-1);size();save(P,prefs)};

  function find(id){return notes.filter(function(n){return n.id===id})[0]}
  function stamp(ts){
    var d=new Date(ts),n=new Date();
    return d.toDateString()===n.toDateString()?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function renderList(){
    var t=q.value.trim().toLowerCase();
    var arr=notes.filter(function(n){return !t||(n.title+' '+n.body+' '+(n.skills||[]).map(function(s){return s.t}).join(' ')).toLowerCase().indexOf(t)>-1})
      .sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.updated-a.updated});
    if(!arr.length){list.innerHTML='<div class="empty">'+(t?'No notes found.':'You don’t have any notes yet. Click “New note” to start.')+'</div>';return}
    list.innerHTML=arr.map(function(n){
      return '<button class="item'+(n.id===cur?' on':'')+'" data-id="'+n.id+'"><b>'+(n.pin?'★ ':'')+esc(n.title||'Untitled')+'</b><span>'+esc((n.body||'Empty note').slice(0,80).replace(/\n/g,' '))+'</span><small>'+stamp(n.updated)+'</small></button>';
    }).join('');
  }

  function words(s){var m=s.trim().match(/\S+/g);return m?m.length:0}
  /* FIX: remember the scroll position, because collapsing the textareas to measure them
     briefly shrinks the page and makes the browser jump the view. Restore it right after. */
  function fit(){
    var st=paper.scrollTop;
    var t=$('title');if(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}
    paper.scrollTop=st;
  }

  function renderEditor(){
    var n=find(cur);
    $('pin').style.display=$('del').style.display=$('sk').style.display=n?'':'none';
    if(!n){paper.innerHTML='<div class="none">Select a note from the list<br>or create a new one.</div>';return}
    $('pin').textContent=n.pin?'Unpin':'Pin';
    paper.innerHTML='<div class="col">'+FMT()+'<textarea class="title" id="title" rows="1" placeholder="Title" aria-label="Title">'+esc(n.title)+'</textarea><div class="body" id="body" contenteditable="true" role="textbox" aria-multiline="true" data-ph="Start writing here…" aria-label="Note content"></div><div class="foot" id="foot"></div><section class="skills" id="skills" aria-label="Skills learned"></section></div>';
    saved=null;
    $('body').innerHTML=n.html!=null?n.html:esc(n.body).replace(/\n/g,'<br>');
    $('title').style.color=n.tc||'';
    foot(n); fit(); renderSkills(n); wireFmt();
    $('title').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();$('body').focus()}};
    $('title').oninput=function(){n.title=this.value;fit();touch(n)};
    $('body').oninput=function(){syncBody(n);touch(n)};
    $('body').onpaste=function(e){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t)};
  }

  /* ---- Colors & symbols (added) ---- */
  var last='body', saved=null;
  var COLORS=[['#d64545','Red'],['#e08a2c','Orange'],['#3f9d5e','Green'],['#3b82d6','Blue'],['#8e5bd6','Purple'],['#d6559a','Pink']];
  var SYMS=['→','←','↑','↓','↔','⇒','⇐','⇑','⇓','⇄','➜','➤','▶','◀','✓','✔','✗','✘','★','☆','•','◦','▪','♥','✦','⚠','…','—','≈','≠','≤','≥','°','©','™'];
  function FMT(){
    return '<div class="fmt" id="fmt"><span class="lbl">Color: <b id="tgt">Text</b></span>'+
      COLORS.map(function(c){return '<button type="button" class="sw" data-c="'+c[0]+'" style="background:'+c[0]+'" aria-label="'+c[1]+'" title="'+c[1]+'"></button>'}).join('')+
      '<input type="color" id="cc" value="#3b82d6" aria-label="Custom color" title="Custom color">'+
      '<button type="button" class="fb" id="cx" title="Remove color">Clear</button><span class="sp2"></span>'+
      '<button type="button" class="fb" id="symb" aria-expanded="false">Arrows &amp; symbols ▾</button><div class="sym" id="sym"></div></div>';
  }
  function wireFmt(){
    var f=$('fmt'),sy=$('sym');
    sy.innerHTML=SYMS.map(function(s){return '<button type="button" data-s="'+s+'" aria-label="Insert '+s+'">'+s+'</button>'}).join('');
    f.onmousedown=function(e){if(e.target.tagName!=='INPUT')e.preventDefault()};
    f.onclick=function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.c)applyColor(b.dataset.c);
      else if(b.id==='cx')applyColor('');
      else if(b.id==='symb')b.setAttribute('aria-expanded',sy.classList.toggle('open'));
      else if(b.dataset.s)ins(b.dataset.s);
    };
    $('cc').oninput=function(){applyColor(this.value)};
    $('tgt').textContent=last==='title'?'Title':'Text';
  }
  function touch(n){
    n.updated=Date.now();status.textContent='Saving…';foot(n);
    clearTimeout(timer);timer=setTimeout(function(){
      var ok=save(K,notes);status.textContent=ok?'Saved':'Can’t save in this browser';renderList();
    },400);
  }
  function syncBody(n){
    var b=$('body'),t=b.innerText.replace(/\u00a0/g,' ').replace(/\n$/,'');
    if(!t){b.innerHTML=''}
    n.html=b.innerHTML;n.body=t;
  }
  function selRestore(){
    var b=$('body'),s=getSelection();
    if(saved&&!(s.rangeCount&&b.contains(s.anchorNode))){s.removeAllRanges();s.addRange(saved)}
  }
  function applyColor(c){
    var n=find(cur);if(!n)return;
    if(last==='title'){n.tc=c;$('title').style.color=c;touch(n);return}
    var b=$('body');selRestore();b.focus();
    document.execCommand('styleWithCSS',false,true);
    if(c)document.execCommand('foreColor',false,c);else document.execCommand('removeFormat');
    syncBody(n);touch(n);
  }
  function ins(s){
    var n=find(cur);if(!n)return;
    if(last==='title'){
      var t=$('title');t.focus();t.setRangeText(s,t.selectionStart,t.selectionEnd,'end');
      t.dispatchEvent(new Event('input',{bubbles:true}));return;
    }
    var b=$('body');selRestore();b.focus();
    document.execCommand('insertText',false,s);
    syncBody(n);touch(n);
  }
  paper.addEventListener('focusin',function(e){
    var id=e.target.id;
    if(id==='title'||id==='body'){last=id;var t=$('tgt');if(t)t.textContent=id==='title'?'Title':'Text'}
  });
  document.addEventListener('selectionchange',function(){
    var b=$('body');if(!b)return;
    var s=getSelection();
    if(s.rangeCount&&b.contains(s.anchorNode))saved=s.getRangeAt(0).cloneRange();
  });
  document.addEventListener('mousedown',function(e){
    var sy=$('sym');
    if(sy&&sy.classList.contains('open')&&!e.target.closest('#fmt')){sy.classList.remove('open');$('symb').setAttribute('aria-expanded','false')}
  });
  document.addEventListener('keydown',function(e){
    var sy=$('sym');
    if(e.key==='Escape'&&sy&&sy.classList.contains('open')){sy.classList.remove('open');$('symb').setAttribute('aria-expanded','false')}
  });

  function foot(n){$('foot').textContent=words(n.body)+' words · '+n.body.length+' characters'}

  /* ---- Skills learned (organized) ---- */
  function clean(s){
    s=s.replace(/^[\s\-\*\u2022\u2013\u2014>▪◦➤✓✔]+/,'').replace(/^\(?\d+[.)]\s+/,'').replace(/\s+/g,' ').trim();
    return s?s.charAt(0).toUpperCase()+s.slice(1):'';
  }
  function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight+2,180)+'px'}
  function persist(n){
    n.updated=Date.now();
    status.textContent=save(K,notes)?'Saved':'Can’t save in this browser';renderList();
  }
  function renderSkills(n,focus){
    var box=$('skills');if(!box)return;
    var arr=n.skills||[];
    $('sk').textContent='Skills learned'+(arr.length?' ('+arr.length+')':'');
    $('sk').classList.toggle('primary',!!n.skOpen);
    if(!n.skOpen){box.style.display='none';box.innerHTML='';return}
    box.style.display='block';
    box.innerHTML='<div class="sk-head"><h3>Skills learned</h3><span class="sk-count">'+(arr.length?arr.length+(arr.length===1?' skill':' skills'):'')+'</span></div>'+
      '<p>Whatever you type or paste is saved exactly as written, with the same lines and spacing. Press Enter to add (Shift+Enter for a new line). One Add = one block.</p>'+
      '<div class="sk-add"><textarea id="skIn" rows="1" placeholder="e.g. Writing clear sentences" aria-label="Add skills"></textarea><button class="btn primary" id="skAdd">Add</button></div>'+
      (arr.length?'<ol class="sk-list">'+arr.map(function(s,i){
        return '<li><div class="m"><span class="t">'+esc(s.t)+'</span><span class="d">Added '+stamp(s.at)+'</span></div>'+
          '<div class="acts"><button data-mv="-1" data-i="'+i+'" aria-label="Move up" title="Move up"'+(i===0?' disabled':'')+'>↑</button>'+
          '<button data-mv="1" data-i="'+i+'" aria-label="Move down" title="Move down"'+(i===arr.length-1?' disabled':'')+'>↓</button>'+
          '<button class="x" data-i="'+i+'" aria-label="Remove skill" title="Remove">×</button></div></li>';
      }).join('')+'</ol>':'<div class="sk-none">No skills yet for this note.</div>');
    var inp=$('skIn');
    function add(){
      var txt=inp.value.replace(/\r\n?/g,'\n').replace(/^\s*\n+/,'').replace(/\s+$/,''),parts=txt?[txt]:[],added=0;
      n.skills=n.skills||[];
      parts.forEach(function(p){
        if(!n.skills.some(function(s){return s.t.toLowerCase()===p.toLowerCase()})){n.skills.push({t:p,at:Date.now()});added++}
      });
      if(added)persist(n);
      renderSkills(n,true);
    }
    $('skAdd').onclick=add;
    inp.oninput=function(){grow(inp)};
    inp.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add()}};
    var ol=box.querySelector('.sk-list');
    if(ol)ol.onclick=function(e){
      var b=e.target.closest('button');if(!b||b.disabled)return;
      var i=+b.dataset.i;
      if(b.dataset.mv){
        var j=i+(+b.dataset.mv);
        if(j<0||j>=n.skills.length)return;
        var tmp=n.skills[i];n.skills[i]=n.skills[j];n.skills[j]=tmp;
      }else if(b.classList.contains('x')){
        n.skills.splice(i,1);
      }else return;
      persist(n);renderSkills(n);
    };
    if(focus)inp.focus();
  }
  $('sk').onclick=function(){
    var n=find(cur);if(!n)return;
    n.skOpen=!n.skOpen;save(K,notes);renderSkills(n,true);
    if(n.skOpen)$('skills').scrollIntoView({behavior:'smooth',block:'nearest'});
  };

  function select(id){cur=id;app.classList.remove('show');renderList();renderEditor()}
  $('new').onclick=function(){
    var n={id:'n'+Date.now(),title:'',body:'',pin:false,updated:Date.now()};
    notes.unshift(n);save(K,notes);q.value='';select(n.id);
    setTimeout(function(){var t=$('title');if(t)t.focus()},50);
  };
  list.onclick=function(e){var b=e.target.closest('.item');if(b)select(b.dataset.id)};
  q.oninput=renderList;
  $('menu').onclick=function(){app.classList.add('show')};
  $('pin').onclick=function(){var n=find(cur);if(!n)return;n.pin=!n.pin;save(K,notes);renderList();renderEditor()};
  $('del').onclick=function(){
    var n=find(cur);if(!n)return;
    if(!confirm('Delete “'+(n.title||'Untitled')+'”? This can’t be undone.'))return;
    notes=notes.filter(function(x){return x.id!==cur});save(K,notes);cur=null;renderList();renderEditor();
  };
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus()}
  });

  /* ---- Download by note title (added) ---- */
  var dlSel=null, dlCap=null;
  try{
    if(window.claude&&claude.use){claude.use('downloads').then(function(d){dlCap=d}).catch(function(){})}
  }catch(e){}
  var dlBack=$('dlBack'),dlQ=$('dlQ'),dlList=$('dlList'),dlGo=$('dlGo'),dlMsg=$('dlMsg');

  function dlRender(){
    var t=dlQ.value.trim().toLowerCase();
    var arr=notes.filter(function(n){return !t||(n.title||'Untitled').toLowerCase().indexOf(t)>-1})
      .sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.updated-a.updated});
    if(dlSel&&!arr.some(function(n){return n.id===dlSel})){dlSel=null}
    dlGo.disabled=!dlSel;
    if(!arr.length){dlList.innerHTML='<div class="empty">'+(notes.length?'No title matches your search.':'There are no notes to download.')+'</div>';return}
    dlList.innerHTML=arr.map(function(n){
      return '<button class="item'+(n.id===dlSel?' on':'')+'" data-id="'+n.id+'"><b>'+(n.pin?'★ ':'')+esc(n.title||'Untitled')+'</b><span>'+words(n.body)+' words · '+stamp(n.updated)+'</span></button>';
    }).join('');
  }
  function dlOpen(){
    if(!notes.length)return;
    dlSel=cur&&find(cur)?cur:null;dlQ.value='';dlMsg.textContent='';
    dlBack.classList.add('open');dlRender();dlQ.focus();
  }
  function dlClose(){dlBack.classList.remove('open')}
  function fname(n){
    var s=(n.title||'Untitled').replace(/[\\\/:*?"<>|\x00-\x1f]/g,'').replace(/\s+/g,' ').trim().slice(0,80);
    return (s||'Untitled')+'.txt';
  }
  function dlDo(){
    var n=find(dlSel);if(!n)return;
    var text=(n.title?n.title+'\n\n':'')+n.body+'\n';
    if(n.skills&&n.skills.length){text+='\nSkills learned:\n'+n.skills.map(function(s,i){return (i+1)+'. '+s.t.replace(/\n/g,'\n   ')}).join('\n')+'\n'}
    var name=fname(n);
    dlMsg.textContent='';
    if(dlCap){
      dlCap.save({filename:name,data:text}).then(function(){
        dlClose();status.textContent='Downloaded “'+(n.title||'Untitled')+'”';
      }).catch(function(err){
        if(err&&err.code==='declined')return;
        dlMsg.textContent='Couldn’t download. Please try again.';
      });
      return;
    }
    try{
      var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1000);
      dlClose();status.textContent='Downloaded “'+(n.title||'Untitled')+'”';
    }catch(e){dlMsg.textContent='Couldn’t download in this browser.'}
  }
  $('dl').onclick=dlOpen;
  $('dlCancel').onclick=dlClose;
  dlGo.onclick=dlDo;
  dlQ.oninput=dlRender;
  dlBack.onclick=function(e){if(e.target===dlBack)dlClose()};
  dlList.onclick=function(e){var b=e.target.closest('.item');if(b){dlSel=b.dataset.id;dlRender()}};
  dlList.ondblclick=function(e){if(e.target.closest('.item'))dlDo()};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&dlBack.classList.contains('open'))dlClose();
  });

  if(!notes.length){
    notes.push({id:'n'+Date.now(),title:'Welcome',body:'This is your first note.\n\nEverything you write is saved automatically in this browser.\n\nTry the colors at the top (Paper, Sage, Night) and A− / A+ to change the text size. Pick whatever feels easiest on your eyes.',pin:false,updated:Date.now()});
    save(K,notes);
  }
  cur=notes.slice().sort(function(a,b){return b.updated-a.updated})[0].id;
  renderList();renderEditor();
})();
</script>
</body>
</html>
