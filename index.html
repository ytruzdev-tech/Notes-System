<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{
  --bg:#f3efe6;--panel:#ebe6da;--text:#2e2c28;--muted:#7a756a;--line:#d9d2c2;--accent:#2f6f6a;--accent-t:#fff;--sel:#ddd6c4;--danger:#a4473d;
  --fs:19px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="sage"]{--bg:#e6ebe2;--panel:#dbe2d6;--text:#25302a;--muted:#6b786f;--line:#c6d0c0;--accent:#3d6b57;--sel:#cbd6c5;--danger:#a4473d}
:root[data-theme="dark"]{--bg:#1f2326;--panel:#262b2f;--text:#d6d9d6;--muted:#8a9190;--line:#363c40;--accent:#7fbfb3;--accent-t:#14201e;--sel:#313840;--danger:#e0877c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:320px 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{padding:16px 16px 8px;display:flex;gap:8px;align-items:center}
.top h1{font-size:18px;margin:0;flex:1;font-weight:600}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px}
.btn:hover{background:var(--sel)}
.btn.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{margin:4px 16px 8px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);width:calc(100% - 32px)}
.list{overflow:auto;flex:1;padding:4px 8px 16px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:10px 12px;margin-bottom:2px}
.item:hover{background:var(--sel)}
.item.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:24px 16px;text-align:center;line-height:1.5}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sel)}
.seg button.on{background:var(--accent);color:var(--accent-t)}
.status{color:var(--muted);font-size:13px}
.menu{display:none}
.paper{flex:1;overflow:auto;padding:32px 20px 80px}
.col{max-width:68ch;margin:0 auto}
.title{width:100%;border:0;background:transparent;font-family:Literata,Georgia,"Times New Roman",serif;font-size:calc(var(--fs) * 1.7);font-weight:600;line-height:1.25;padding:0;margin:0 0 16px;outline:0;display:block;resize:none;overflow:hidden;overflow-wrap:anywhere}
.body{width:100%;min-height:60vh;border:0;background:transparent;resize:none;outline:0;font-family:Literata,Georgia,"Times New Roman",serif;font-size:var(--fs);line-height:1.8;padding:0;overflow:hidden}
.title::placeholder,.body::placeholder{color:var(--muted);opacity:.7}
.foot{color:var(--muted);font-size:13px;margin-top:12px}
.none{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:24px;line-height:1.6}

/* ---- Download dialog (added) ---- */
.dl-back{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
.dl-back.open{display:flex}
.dl-box{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;max-height:min(560px,90%);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dl-head{padding:18px 20px 4px}
.dl-head h2{margin:0;font-size:18px;font-weight:600}
.dl-head p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.dl-box .search{margin:12px 20px 8px;width:calc(100% - 40px)}
.dl-list{overflow:auto;flex:1;padding:0 12px 8px;min-height:80px}
.dl-list .item.on b::before{content:"✓ ";color:var(--accent)}
.dl-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px 18px;border-top:1px solid var(--line)}
.dl-msg{flex:1;color:var(--muted);font-size:13px;min-height:1em}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0;z-index:5;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .app.show aside{transform:none}
  .menu{display:inline-block}
  .paper{padding:20px 16px 80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="top">
      <h1>Notes</h1>
      <button class="btn primary" id="new">+ New note</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search notes" aria-label="Search notes">
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="bar">
      <button class="btn menu" id="menu" aria-label="Open notes list">Notes list</button>
      <div class="seg" id="themes" role="group" aria-label="Page color">
        <button data-t="light">Paper</button><button data-t="sage">Sage</button><button data-t="dark">Night</button>
      </div>
      <div class="seg" role="group" aria-label="Text size">
        <button id="dec" aria-label="Smaller text">A−</button><button id="inc" aria-label="Larger text">A+</button>
      </div>
      <span class="sp"></span>
      <span class="status" id="status"></span>
      <button class="btn" id="dl">Download</button>
      <button class="btn" id="pin">Pin</button>
      <button class="btn" id="del" style="color:var(--danger)">Delete</button>
    </div>
    <div class="paper" id="paper"></div>
  </main>
</div>

<div class="dl-back" id="dlBack">
  <div class="dl-box" role="dialog" aria-modal="true" aria-labelledby="dlTitle">
    <div class="dl-head">
      <h2 id="dlTitle">Download a note</h2>
      <p>Choose the note title you want to download. Its content will be saved as a text file.</p>
    </div>
    <input class="search" id="dlQ" type="search" placeholder="Type to find a title" aria-label="Find a note title">
    <div class="dl-list" id="dlList"></div>
    <div class="dl-foot">
      <span class="dl-msg" id="dlMsg"></span>
      <button class="btn" id="dlCancel">Cancel</button>
      <button class="btn primary" id="dlGo" disabled>Download</button>
    </div>
  </div>
</div>

<script>
(function(){
  var K='mga-tala-v1', P='mga-tala-prefs';
  var notes=[], cur=null, prefs={theme:null,fs:19}, timer=null;
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  notes=load(K,[]); prefs=Object.assign(prefs,load(P,{}));
  var $=function(i){return document.getElementById(i)};
  var app=$('app'),list=$('list'),paper=$('paper'),q=$('q'),status=$('status');

  function theme(t){
    if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
    document.documentElement.setAttribute('data-theme',t);
    document.querySelectorAll('#themes button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t)});
    return t;
  }
  function size(){document.documentElement.style.setProperty('--fs',prefs.fs+'px');fit()}
  theme(prefs.theme); size();

  $('themes').onclick=function(e){var t=e.target.dataset.t;if(!t)return;prefs.theme=t;theme(t);save(P,prefs)};
  $('inc').onclick=function(){prefs.fs=Math.min(30,prefs.fs+1);size();save(P,prefs)};
  $('dec').onclick=function(){prefs.fs=Math.max(14,prefs.fs-1);size();save(P,prefs)};

  function find(id){return notes.filter(function(n){return n.id===id})[0]}
  function stamp(ts){
    var d=new Date(ts),n=new Date();
    return d.toDateString()===n.toDateString()?d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function renderList(){
    var t=q.value.trim().toLowerCase();
    var arr=notes.filter(function(n){return !t||(n.title+' '+n.body).toLowerCase().indexOf(t)>-1})
      .sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.updated-a.updated});
    if(!arr.length){list.innerHTML='<div class="empty">'+(t?'No notes found.':'You don’t have any notes yet. Click “New note” to start.')+'</div>';return}
    list.innerHTML=arr.map(function(n){
      return '<button class="item'+(n.id===cur?' on':'')+'" data-id="'+n.id+'"><b>'+(n.pin?'★ ':'')+esc(n.title||'Untitled')+'</b><span>'+esc((n.body||'Empty note').slice(0,80).replace(/\n/g,' '))+'</span><small>'+stamp(n.updated)+'</small></button>';
    }).join('');
  }

  function words(s){var m=s.trim().match(/\S+/g);return m?m.length:0}
  function fit(){var t=$('title');if(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}var b=$('body');if(b){b.style.height='auto';b.style.height=Math.max(b.scrollHeight,window.innerHeight*0.6)+'px'}}

  function renderEditor(){
    var n=find(cur);
    $('pin').style.display=$('del').style.display=n?'':'none';
    if(!n){paper.innerHTML='<div class="none">Select a note from the list<br>or create a new one.</div>';return}
    $('pin').textContent=n.pin?'Unpin':'Pin';
    paper.innerHTML='<div class="col"><textarea class="title" id="title" rows="1" placeholder="Title" aria-label="Title">'+esc(n.title)+'</textarea><textarea class="body" id="body" placeholder="Start writing here…" aria-label="Note content"></textarea><div class="foot" id="foot"></div></div>';
    $('body').value=n.body; foot(n); fit();
    $('title').onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();$('body').focus()}};
    $('title').oninput=$('body').oninput=function(){
      n.title=$('title').value;n.body=$('body').value;n.updated=Date.now();
      status.textContent='Saving…';fit();foot(n);
      clearTimeout(timer);timer=setTimeout(function(){
        var ok=save(K,notes);status.textContent=ok?'Saved':'Can’t save in this browser';renderList();
      },400);
    };
  }
  function foot(n){$('foot').textContent=words(n.body)+' words · '+n.body.length+' characters'}

  function select(id){cur=id;app.classList.remove('show');renderList();renderEditor()}
  $('new').onclick=function(){
    var n={id:'n'+Date.now(),title:'',body:'',pin:false,updated:Date.now()};
    notes.unshift(n);save(K,notes);q.value='';select(n.id);
    setTimeout(function(){var t=$('title');if(t)t.focus()},50);
  };
  list.onclick=function(e){var b=e.target.closest('.item');if(b)select(b.dataset.id)};
  q.oninput=renderList;
  $('menu').onclick=function(){app.classList.add('show')};
  $('pin').onclick=function(){var n=find(cur);if(!n)return;n.pin=!n.pin;save(K,notes);renderList();renderEditor()};
  $('del').onclick=function(){
    var n=find(cur);if(!n)return;
    if(!confirm('Delete “'+(n.title||'Untitled')+'”? This can’t be undone.'))return;
    notes=notes.filter(function(x){return x.id!==cur});save(K,notes);cur=null;renderList();renderEditor();
  };
  window.addEventListener('resize',fit);
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(fit)}
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus()}
  });

  /* ---- Download by note title (added) ---- */
  var dlSel=null, dlCap=null;
  try{
    if(window.claude&&claude.use){claude.use('downloads').then(function(d){dlCap=d}).catch(function(){})}
  }catch(e){}
  var dlBack=$('dlBack'),dlQ=$('dlQ'),dlList=$('dlList'),dlGo=$('dlGo'),dlMsg=$('dlMsg');

  function dlRender(){
    var t=dlQ.value.trim().toLowerCase();
    var arr=notes.filter(function(n){return !t||(n.title||'Untitled').toLowerCase().indexOf(t)>-1})
      .sort(function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.updated-a.updated});
    if(dlSel&&!arr.some(function(n){return n.id===dlSel})){dlSel=null}
    dlGo.disabled=!dlSel;
    if(!arr.length){dlList.innerHTML='<div class="empty">'+(notes.length?'No title matches your search.':'There are no notes to download.')+'</div>';return}
    dlList.innerHTML=arr.map(function(n){
      return '<button class="item'+(n.id===dlSel?' on':'')+'" data-id="'+n.id+'"><b>'+(n.pin?'★ ':'')+esc(n.title||'Untitled')+'</b><span>'+words(n.body)+' words · '+stamp(n.updated)+'</span></button>';
    }).join('');
  }
  function dlOpen(){
    if(!notes.length)return;
    dlSel=cur&&find(cur)?cur:null;dlQ.value='';dlMsg.textContent='';
    dlBack.classList.add('open');dlRender();dlQ.focus();
  }
  function dlClose(){dlBack.classList.remove('open')}
  function fname(n){
    var s=(n.title||'Untitled').replace(/[\\\/:*?"<>|\x00-\x1f]/g,'').replace(/\s+/g,' ').trim().slice(0,80);
    return (s||'Untitled')+'.txt';
  }
  function dlDo(){
    var n=find(dlSel);if(!n)return;
    var text=(n.title?n.title+'\n\n':'')+n.body+'\n';
    var name=fname(n);
    dlMsg.textContent='';
    if(dlCap){
      dlCap.save({filename:name,data:text}).then(function(){
        dlClose();status.textContent='Downloaded “'+(n.title||'Untitled')+'”';
      }).catch(function(err){
        if(err&&err.code==='declined')return;
        dlMsg.textContent='Couldn’t download. Please try again.';
      });
      return;
    }
    try{
      var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1000);
      dlClose();status.textContent='Downloaded “'+(n.title||'Untitled')+'”';
    }catch(e){dlMsg.textContent='Couldn’t download in this browser.'}
  }
  $('dl').onclick=dlOpen;
  $('dlCancel').onclick=dlClose;
  dlGo.onclick=dlDo;
  dlQ.oninput=dlRender;
  dlBack.onclick=function(e){if(e.target===dlBack)dlClose()};
  dlList.onclick=function(e){var b=e.target.closest('.item');if(b){dlSel=b.dataset.id;dlRender()}};
  dlList.ondblclick=function(e){if(e.target.closest('.item'))dlDo()};
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&dlBack.classList.contains('open'))dlClose();
  });

  if(!notes.length){
    notes.push({id:'n'+Date.now(),title:'Welcome',body:'This is your first note.\n\nEverything you write is saved automatically in this browser.\n\nTry the colors at the top (Paper, Sage, Night) and A− / A+ to change the text size. Pick whatever feels easiest on your eyes.',pin:false,updated:Date.now()});
    save(K,notes);
  }
  cur=notes.slice().sort(function(a,b){return b.updated-a.updated})[0].id;
  renderList();renderEditor();
})();
</script>
</body>
</html>
